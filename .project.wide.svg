<svg viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시냅스 연결 판정 재현 흐름 — 출발 뉴런의 스파이크와 도착 뉴런의 전압을 평균해 템플릿과 비교하고, 판정을 논문과 대조한다">
  <title>스파이크에서 연결 판정까지</title>
  <defs>
    <marker id="flow-arrow-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8e75" />
    </marker>
  </defs>

  <rect x="0" y="0" width="250" height="204" rx="18" fill="#ffffff" stroke="#e2dac8" stroke-width="1" />
  <text x="22" y="34" font-size="12" fill="#6e6960" font-weight="700" letter-spacing="2">입력</text>
  <rect x="280" y="0" width="270" height="204" rx="18" fill="#68604d" />
  <text x="302" y="34" font-size="12" fill="#c9cfb3" font-weight="700" letter-spacing="2">판정</text>
  <rect x="580" y="0" width="195" height="204" rx="18" fill="#f1ead8" />
  <text x="602" y="34" font-size="12" fill="#6e6960" font-weight="700" letter-spacing="2">결과</text>
  <rect x="805" y="0" width="195" height="204" rx="18" fill="#f1ead8" />
  <text x="827" y="34" font-size="12" fill="#6e6960" font-weight="700" letter-spacing="2">검증</text>
  <text x="22" y="76" font-size="20" fill="#24231f" font-weight="600">출발 뉴런</text>
  <text x="22" y="102" font-size="15" fill="#5f5d55">스파이크가 난 시점</text>
  <line x1="22" y1="122" x2="228" y2="122" stroke="#e2dac8" stroke-width="1" />
  <text x="22" y="156" font-size="20" fill="#24231f" font-weight="600">도착 뉴런</text>
  <text x="22" y="182" font-size="15" fill="#5f5d55">세포 안에서 잰 전압</text>
  <text x="302" y="106" font-size="22" fill="#ffffff" font-weight="600">평균 + 템플릿</text>
  <text x="302" y="132" font-size="15" fill="#efe8d6">스파이크마다 전압을 평균해</text>
  <text x="302" y="153" font-size="15" fill="#efe8d6">템플릿 4개와 비교한다</text>
  <text x="602" y="105" font-size="20" fill="#24231f" font-weight="600">연결 판정</text>
  <text x="602" y="131" font-size="15" fill="#5f5d55">흥분 · 억제 연결</text>
  <text x="602" y="152" font-size="15" fill="#5f5d55">또는 연결 없음</text>
  <text x="827" y="105" font-size="20" fill="#24231f" font-weight="600">논문과 대조</text>
  <text x="827" y="131" font-size="15" fill="#5f5d55">출발 전극 하나의</text>
  <text x="827" y="152" font-size="15" fill="#5f5d55">23개, 종류까지 일치</text>
  <line x1="255" y1="102.0" x2="274" y2="102.0" stroke="#8a8e75" stroke-width="1.5" marker-end="url(#flow-arrow-w)" />
  <line x1="555" y1="102.0" x2="574" y2="102.0" stroke="#8a8e75" stroke-width="1.5" marker-end="url(#flow-arrow-w)" />
  <line x1="780" y1="102.0" x2="799" y2="102.0" stroke="#8a8e75" stroke-width="1.5" marker-end="url(#flow-arrow-w)" />
  <text x="500.0" y="244" font-size="15" fill="#6e6960" text-anchor="middle">스파이크 검출·평균 단계는 논문의 시점이 공개되지 않아 검증하지 못했다</text>
</svg>
