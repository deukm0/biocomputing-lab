<svg viewBox="0 0 1000 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시냅스 연결 판정 재현 흐름 — 출발 뉴런의 스파이크마다 도착 뉴런 전압을 평균하고 템플릿과 비교해 연결을 판정한 뒤 논문 라벨과 대조한다">
  <title>스파이크에서 연결 판정까지</title>

  <line x1="100" y1="34" x2="900" y2="34" stroke="#d8ccb0" stroke-width="3" />
  <circle cx="100" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="100" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">1</text>
  <text x="100" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">스파이크 찾기</text>
  <text x="100" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">출발 뉴런이</text>
  <text x="100" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">발화한 시점</text>
  <circle cx="300" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="300" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">2</text>
  <text x="300" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">전압 평균</text>
  <text x="300" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">스파이크마다</text>
  <text x="300" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">도착 전압을 평균</text>
  <circle cx="500" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="500" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">3</text>
  <text x="500" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">템플릿 비교</text>
  <text x="500" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">정렬한 뒤</text>
  <text x="500" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">템플릿 4개와 상관</text>
  <circle cx="700" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="700" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">4</text>
  <text x="700" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">연결 판정</text>
  <text x="700" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">흥분 · 억제</text>
  <text x="700" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">또는 연결 없음</text>
  <circle cx="900" cy="34" r="22" fill="#68604d" stroke="#68604d" stroke-width="2.5" />
  <text x="900" y="39.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="900" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">논문과 대조</text>
  <text x="900" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">출발 전극 하나의</text>
  <text x="900" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">23개, 종류까지 일치</text>
  <text x="500.0" y="208" font-size="15" fill="#6e6960" text-anchor="middle">1~2단계는 논문의 스파이크 시점이 공개되지 않아 검증하지 못했다</text>
</svg>
