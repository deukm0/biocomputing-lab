<svg viewBox="0 0 350 353" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시냅스 연결 판정 재현 흐름 — 출발 뉴런의 스파이크마다 도착 뉴런 전압을 평균하고 템플릿과 비교해 연결을 판정한 뒤 논문 라벨과 대조한다">
  <title>스파이크에서 연결 판정까지</title>

  <line x1="17" y1="17" x2="17" y2="281" stroke="#d8ccb0" stroke-width="2.5" />
  <circle cx="17" cy="17" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="21.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">1</text>
  <text x="48" y="14" font-size="15" fill="#24231f" font-weight="600">스파이크 찾기</text>
  <text x="48" y="33" font-size="12.5" fill="#5f5d55">출발 뉴런이 발화한 시점</text>
  <circle cx="17" cy="83" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="87.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">2</text>
  <text x="48" y="80" font-size="15" fill="#24231f" font-weight="600">전압 평균</text>
  <text x="48" y="99" font-size="12.5" fill="#5f5d55">스파이크마다 도착 전압을 평균</text>
  <circle cx="17" cy="149" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="153.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">3</text>
  <text x="48" y="146" font-size="15" fill="#24231f" font-weight="600">템플릿 비교</text>
  <text x="48" y="165" font-size="12.5" fill="#5f5d55">정렬한 뒤 템플릿 4개와 상관</text>
  <circle cx="17" cy="215" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="219.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">4</text>
  <text x="48" y="212" font-size="15" fill="#24231f" font-weight="600">연결 판정</text>
  <text x="48" y="231" font-size="12.5" fill="#5f5d55">흥분 · 억제 또는 연결 없음</text>
  <circle cx="17" cy="281" r="15" fill="#68604d" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="285.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="48" y="278" font-size="15" fill="#24231f" font-weight="600">논문과 대조</text>
  <text x="48" y="297" font-size="12.5" fill="#5f5d55">출발 전극 하나의 23개, 종류까지 일치</text>
  <text x="0" y="330" font-size="12" fill="#6e6960">1~2단계는 논문의 스파이크 시점이 공개되지</text>
  <text x="0" y="347" font-size="12" fill="#6e6960">않아 검증하지 못했다</text>
</svg>
